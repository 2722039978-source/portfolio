<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0071e3"/>
      <stop offset="100%" stop-color="#ac39ff"/>
    </linearGradient>
    <linearGradient id="pig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCE4EC"/>
      <stop offset="100%" stop-color="#F8BBD0"/>
    </linearGradient>
  </defs>

  <!-- 圆角方形背景 -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bg)"/>

  <!-- 外圈光环 -->
  <circle cx="256" cy="220" r="180" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <circle cx="256" cy="220" r="150" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="8 6"/>

  <!-- 猪猪脸部 -->
  <circle cx="256" cy="230" r="110" fill="url(#pig)"/>
  <ellipse cx="230" cy="200" rx="55" ry="40" fill="#FCE4EC" opacity="0.6"/>

  <!-- 耳朵 -->
  <ellipse cx="170" cy="130" rx="38" ry="48" fill="#F48FB1" transform="rotate(-12 170 130)"/>
  <ellipse cx="170" cy="130" rx="24" ry="34" fill="#F8BBD0" transform="rotate(-12 170 130)"/>
  <ellipse cx="342" cy="130" rx="38" ry="48" fill="#F48FB1" transform="rotate(12 342 130)"/>
  <ellipse cx="342" cy="130" rx="24" ry="34" fill="#F8BBD0" transform="rotate(12 342 130)"/>

  <!-- 眼睛 -->
  <ellipse cx="216" cy="200" rx="14" ry="16" fill="#4A2800"/>
  <circle cx="222" cy="194" r="5" fill="white"/>
  <ellipse cx="296" cy="200" rx="14" ry="16" fill="#4A2800"/>
  <circle cx="302" cy="194" r="5" fill="white"/>

  <!-- 鼻子 -->
  <ellipse cx="256" cy="260" rx="48" ry="34" fill="#EC407A"/>
  <ellipse cx="238" cy="258" rx="10" ry="12" fill="#8B234E"/>
  <ellipse cx="274" cy="258" rx="10" ry="12" fill="#8B234E"/>
  <ellipse cx="234" cy="254" rx="3" ry="4" fill="#A8325C"/>
  <ellipse cx="270" cy="254" rx="3" ry="4" fill="#A8325C"/>

  <!-- 微笑 -->
  <path d="M 220 290 Q 256 320 292 290" stroke="#C2185B" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- 底部文字 -->
  <text x="256" y="440" text-anchor="middle" fill="white" font-family="system-ui,sans-serif" font-weight="700" font-size="48" letter-spacing="4">
    NOOSPHERE
  </text>
</svg>
